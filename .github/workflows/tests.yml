name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'streamlit>=1.48,<2' 'Pillow>=10,<13' 'numpy>=2,<3' pytest
      - name: Run tests
        run: python -m pytest -q
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install application dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Load checkpoints and run inference
        run: python scripts/check_models.py
